[project]
name = "receipt-ai"
version = "0.2.0"
description = "Receipt capture, organization, search, and spending intelligence app."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",
    "sqlalchemy>=2.0.0",
    "loguru>=0.7.0",
    "livekit-api>=1.0.0",
    "pywebpush>=2.0.3",
    "firebase-admin>=6.6.0",
    "github-copilot-sdk>=1.0.5",
    "google-genai>=1.0.0",
    "groq>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "E402",
    "F401",
    "F811",
    "F841",
    # Existing application-wide patterns are retained while the codebase is
    # migrated incrementally; keep new lint rules actionable for feature PRs.
    "B019",
    "BLE001",
    "DTZ003",
    "DTZ007",
    "FURB162",
    "FURB167",
    "FURB192",
    "I001",
    "PLR1722",
    "RUF012",
    "S110",
    "S112",
    "TRY004",
    "UP006",
    "UP012",
    "UP017",
    "UP035",
    "UP045",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: tests that require a deployed production service",
]

[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
